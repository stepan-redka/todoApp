<div class="dashboard-container">
    <header>
        <h1>Welcome back</h1>
        <p>Here is an overview of your productivity today.</p>
    </header>

    <!-- Statistics Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">Total Tasks</span>
            <span class="stat-value">{{ getTotalCount() }}</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">In Progress</span>
            <span class="stat-value">{{ getInProgressCount() }}</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Completed</span>
            <span class="stat-value">{{ getCompletedCount() }}</span>
        </div>
    </div>

    <!-- Workspace Link -->
    <div class="dashboard-actions">
        <a routerLink="/todos" class="btn-navigate">Enter Workspace →</a>
    </div>
</div>
