<div class="login-container">
    <div class="login-card">
        <header>
            <h2>{{ isLoginMode ? 'Sign in to Todo' : 'Create your account' }}</h2>
            <p>{{ isLoginMode ? 'Enter your credentials to access your workspace.' : 'Sign up to get started with your private workspace.' }}</p>
        </header>

        <form (submit)="onSubmit(); $event.preventDefault()">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="steve@jobs.com"
                    required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="••••••••"
                    required />
            </div>

            @if (errorMessage) {
            <p class="error-text">{{ errorMessage }}</p>
            }

            @if (successMessage) {
            <p class="success-text">{{ successMessage }}</p>
            }

            <button type="submit" class="btn-submit">
                {{ isLoginMode ? 'Sign In' : 'Sign Up' }}
            </button>

            <div class="mode-toggle">
                <button type="button" class="btn-link" (click)="toggleMode()">
                    {{ isLoginMode ? "Don't have an account? Sign up" : 'Already have an account? Sign in' }}
                </button>
            </div>
        </form>
    </div>
</div>
